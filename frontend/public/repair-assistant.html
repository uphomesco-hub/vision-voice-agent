<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeno AI - Voice Session</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text" id="statusText">READY</span>
                </div>
            </div>
            <div class="header-center">
                <h1 class="app-title">Zeno AI</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="settingsBtn" data-testid="settings-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.5-13 4.5 4.5M5.5 18.5 1 23m17.5-5.5 4.5 4.5M1 1l4.5 4.5M23 1l-4.5 4.5M5.5 5.5 1 1"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Setup Panel (shown initially) -->
            <div class="setup-panel" id="setupPanel">
                <div class="setup-content">
                    <div class="setup-hero">
                        <div class="voice-icon-large" data-testid="voice-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                        </div>
                        <h2 class="setup-title">Voice Troubleshooting</h2>
                        <p class="setup-subtitle">Talk naturally with Zeno AI</p>
                    </div>

                    <div class="setup-options">
                        <div class="option-group">
                            <label class="option-label" for="personaSelect">Assistant Personality</label>
                            <select id="personaSelect" class="option-select" data-testid="persona-select">
                                <option value="">Loading...</option>
                            </select>
                        </div>

                        <div class="option-group">
                            <label class="option-label" for="voiceSelect">Voice</label>
                            <select id="voiceSelect" class="option-select" data-testid="voice-select">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn-primary" id="startBtn" data-testid="start-session-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                        Start Session
                    </button>
                </div>
            </div>

            <!-- Voice Session Panel (hidden initially) -->
            <div class="voice-panel hidden" id="voicePanel">
                <div class="voice-status-area">
                    <div class="voice-visualizer" id="visualizer" data-testid="voice-visualizer">
                        <div class="visualizer-wave">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>
                    <div class="voice-status-text" id="voiceStatus" data-testid="voice-status-text">Ready</div>
                </div>

                <!-- Transcript Panel -->
                <div class="transcript-container" id="transcriptContainer">
                    <div class="transcript-header">
                        <h3 class="transcript-title">Conversation</h3>
                        <button class="transcript-toggle" id="transcriptToggle" data-testid="transcript-toggle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                    </div>
                    <div class="transcript-messages" id="transcriptMessages" data-testid="transcript-messages">
                        <!-- Messages will be added here dynamically -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Controls Bar -->
        <div class="controls-bar" id="controlsBar">
            <div class="controls-container">
                <button class="control-btn" id="micBtn" disabled data-testid="mic-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                </button>
                
                <button class="control-btn control-btn-end hidden" id="endBtn" data-testid="end-session-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><line x1="18" x2="18" y1="2" y2="8"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- LiveKit Client SDK -->
    <script src="https://unpkg.com/livekit-client@2.9.1/dist/livekit-client.umd.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
