name: VisionVoiceAgent
options:
  bundleIdPrefix: co.uphomes
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  AgentMobile:
    type: application
    platform: iOS
    sources:
      - path: AgentMobile
      - path: Shared
    dependencies:
      - target: AgentLiveActivityExtension
        embed: true
    info:
      path: AgentMobile/Info.plist
      properties:
        CFBundleDisplayName: Vision Voice
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: co.uphomes.visionvoiceagent
            CFBundleURLSchemes:
              - visionvoiceagent
        NSCameraUsageDescription: Vision Voice uses the camera so the agent can inspect the repair scene.
        NSMicrophoneUsageDescription: Vision Voice uses the microphone for live voice sessions with the agent.
        NSSupportsLiveActivities: true
    entitlements:
      path: AgentMobile/AgentMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.co.uphomes.visionvoiceagent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.uphomes.visionvoiceagent
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
  AgentLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentLiveActivityExtension
      - path: Shared
    info:
      path: AgentLiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: Vision Voice Activity
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AgentLiveActivityExtension/AgentLiveActivityExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.co.uphomes.visionvoiceagent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.uphomes.visionvoiceagent.liveactivity
        SKIP_INSTALL: true
